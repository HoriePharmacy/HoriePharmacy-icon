<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
async function closeAfter3Seconds(){

  try{
    await liff.init({ liffId: "2009339330-tZLIvLQ4" }); // LIFF ID
  }catch(e){}

  setTimeout(function(){

    if (typeof liff !== "undefined" && liff.isInClient()) {
      liff.closeWindow(); // LINE内ブラウザ
    } else {
      window.close(); // 通常ブラウザ
    }

  },3000);
}

window.onload = closeAfter3Seconds;
</script>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial;
  background: linear-gradient(135deg,#d8f1cf,#fdeff2);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:25px 20px;
  text-align:center;
  min-height:100vh;
}

h1{
  color:#4a6b63;
  font-size:32px;
  margin:20px 0;
}

p{
  font-size:20px;
}

img.character{
  width:200px;
  max-width:70%;
  margin-bottom:30px;
}
</style>
</head>

<body>

<img class="character" src="character.png">

<h1>ご記入ありがとうございました！</h1>

<p>
お薬が準備できるまで<br>
少々お待ちください
</p>

<p style="font-size:14px;color:#666;">
この画面は3秒後に閉じます
</p>

</body>
</html>
