<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial;
    background: linear-gradient(135deg,#d8f1cf,#fdeff2);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    text-align: center;
  }
  h1 { color: #4a6b63; font-size: 24px; margin-bottom: 15px; }
  p { color: #333; font-size: 16px; margin-bottom: 30px; }
  .button {
    display: inline-block;
    padding: 12px 25px;
    border-radius: 12px;
    background: #7ec8a5;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    transition: 0.2s;
  }
  .button:hover { background: #6bb596; }
  img.character { width: 120px; margin-bottom: 25px; }
</style>
</head>
<body>
  <img class="character" src="character.png" alt="オリジナルキャラクター">
  <h1>ご記入ありがとうございました！</h1>
  <p>お薬が準備できるまで、少々お待ちください。</p>
  <a class="button" href="https://lin.ee/zIXCNhY">LINEに戻る</a>
</body>
</html>
